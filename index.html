<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ff7a00" />
  <title>euTreino</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/supabase.js"></script>
</head>
<body>
  <div class="app-shell">

    <!-- ==================== VIEW 1: AGENDA ==================== -->
    <div id="view-agenda" class="view active">
      <header class="top-bar">
        <button id="btn-open-avulsa" class="icon-btn" title="Aula Avulsa">🏃</button>
        <h1>Agenda 23@18:47</h1>
        <div class="header-actions">
          <button id="btn-help" class="icon-btn" title="Legenda">?</button>
          <button id="btn-today" class="icon-btn" title="Ir para Hoje">🕒</button>
        </div>
      </header>

      <div class="main-content">
        <div class="calendar-controls">
          <button id="month-label" class="month-picker">November 2026 &gt;</button>
          <div class="nav-arrows">
            <button id="btn-toggle-calendar" class="toggle-cal-btn" title="Recolher/Expandir Calendário">▲</button>
            <button id="btn-prev-month">&lt;</button>
            <button id="btn-next-month">&gt;</button>
          </div>
        </div>

        <section id="calendar-wrapper" class="calendar-wrapper">
          <div id="calendar-weekdays" class="weekdays"></div>
          <div id="calendar-grid" class="calendar-grid"></div>
        </section>

        <section id="agenda-timeline" class="timeline"></section>
      </div>
    </div>

    <!-- ==================== VIEW 2: AULA AVULSA (MODAL) ==================== -->
    <div id="view-avulsa" class="view modal-view">
      <header class="top-bar">
        <button id="btn-cancel-avulsa" class="text-btn">Cancelar</button>
        <span></span>
        <button id="btn-save-avulsa" class="text-btn bold">Salvar</button>
      </header>

      <div class="avulsa-banner">
        <img src="img/i192.png" alt="Treino" />
        <div class="banner-overlay">
          <h2 id="avulsa-title">Aula Avulsa - 16/11/26</h2>
        </div>
      </div>

      <div class="avulsa-body">
        <div class="combo-input-wrap">
          <input type="text" id="avulsa-name-input" placeholder="Nome (avulso)" autocomplete="off" />
          <select id="avulsa-client-select" aria-label="Selecionar aluno existente">
            <option value="">⌄</option>
          </select>
        </div>

        <div class="dual-wheel-card">
          <div class="wheel-group">
            <span class="wheel-title">HORÁRIO</span>
            <div class="ios-wheel" id="avulsa-time-wheel">
              <div class="wheel-highlight"></div>
              <div class="wheel-col" id="avulsa-time-col"></div>
            </div>
          </div>

          <div class="wheel-group">
            <span class="wheel-title">VALOR</span>
            <div class="ios-wheel" id="avulsa-price-wheel">
              <div class="wheel-highlight"></div>
              <div class="wheel-col" id="avulsa-price-col"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ==================== VIEW 3: CLIENTES ==================== -->
    <div id="view-clientes" class="view">
      <header class="top-bar">
        <span style="width:28px"></span>
        <h1>Clientes</h1>
        <button id="btn-add-client" class="icon-btn plus-circle" title="Novo Cliente">+</button>
      </header>

      <div id="clients-list" class="main-content scroll-pad"></div>
    </div>

    <!-- ==================== VIEW 4: INFO (ADD/EDIT CLIENT) ==================== -->
    <div id="view-info" class="view modal-view">
      <header class="top-bar">
        <button id="btn-back-info" class="icon-btn">&lt;</button>
        <h1>Info</h1>
        <div class="header-actions">
          <button id="btn-delete-client" class="icon-btn hidden" title="Excluir">🗑️</button>
          <button id="btn-save-client" class="text-btn bold">Salvar</button>
        </div>
      </header>

      <div class="main-content scroll-pad">
        <div class="info-avatar-row">
          <div id="info-avatar-preview" class="avatar-circle large">👤</div>
          <div class="color-swatches" id="color-swatches">
            <button type="button" class="swatch active" data-color="#00B2E3" style="background:#00B2E3"></button>
            <button type="button" class="swatch" data-color="#FFE066" style="background:#FFE066"></button>
            <button type="button" class="swatch" data-color="#34C759" style="background:#34C759"></button>
            <button type="button" class="swatch" data-color="#FF9F43" style="background:#FF9F43"></button>
            <button type="button" class="swatch" data-color="#A55EEA" style="background:#A55EEA"></button>
          </div>
        </div>

        <input type="text" id="info-name" class="form-input" placeholder="Nome" />

        <div class="form-row-split">
          <span class="prefix">+55</span>
          <input type="tel" id="info-phone" placeholder="Fone (ex: 47999999999)" />
          <span class="flag">🇧🇷</span>
        </div>

        <div class="form-row-split">
          <span>Valor-Aula</span>
          <select id="info-rate" class="inline-select"></select>
        </div>

        <div id="info-weekdays-box" class="weekdays-schedule-card"></div>
      </div>
    </div>

    <!-- ==================== VIEW 5: FECHAMENTO ==================== -->
    <div id="view-fechamento" class="view">
      <header class="top-bar">
        <span style="width:28px"></span>
        <h1>Fechamento</h1>
        <span style="width:28px"></span>
      </header>

      <div class="main-content scroll-pad">
        <!-- Segmented Control -->
        <div class="segmented-control">
          <button class="seg-btn active" data-mode="mes">Mês</button>
          <button class="seg-btn" data-mode="ano">Ano</button>
          <button class="seg-btn" data-mode="datas">Datas</button>
        </div>

        <!-- Filter Controls -->
        <div id="filter-mes" class="filter-panel active">
          <div class="ios-wheel single-wheel">
            <div class="wheel-highlight"></div>
            <div class="wheel-col" id="fechamento-month-col"></div>
          </div>
        </div>

        <div id="filter-ano" class="filter-panel">
          <div class="ios-wheel single-wheel">
            <div class="wheel-highlight"></div>
            <div class="wheel-col" id="fechamento-year-col"></div>
          </div>
        </div>

        <div id="filter-datas" class="filter-panel date-range-box">
          <input type="date" id="fechamento-start-date" />
          <span>até</span>
          <input type="date" id="fechamento-end-date" />
        </div>

        <!-- Client Billing Accordions -->
        <div id="fechamento-list" class="fechamento-list"></div>
      </div>
    </div>

    <!-- ==================== VIEW 6: AJUSTES ==================== -->
    <div id="view-ajustes" class="view">
      <header class="top-bar">
        <span style="width:28px"></span>
        <h1>Ajustes</h1>
        <span style="width:28px"></span>
      </header>

      <div class="main-content scroll-pad">
        <div class="settings-row">
          <span>Valor-Aula</span>
          <select id="set-default-rate" class="inline-select teal-text"></select>
        </div>

        <div class="settings-row">
          <span>Tempo-Aula (minutos)</span>
          <button id="set-duration-btn" class="duration-badge">60</button>
        </div>

        <div class="settings-row">
          <span>Finais de Semana</span>
          <label class="ios-switch">
            <input type="checkbox" id="set-weekends" />
            <span class="slider"></span>
          </label>
        </div>

        <button id="btn-edit-msg-fechamento" class="settings-row clickable">
          <span>Texto Fechamento</span>
          <span class="chevron">&gt;</span>
        </button>

        <button id="btn-edit-msg-aniversario" class="settings-row clickable">
          <span>Texto Aniversários</span>
          <span class="chevron">&gt;</span>
        </button>

        <div class="settings-row">
          <span>Nome do Treinador(a)</span>
          <input type="text" id="set-trainer-name" class="inline-text-right" />
        </div>
      </div>
    </div>

    <!-- ==================== MODAL: MESSAGE TEMPLATE EDITOR ==================== -->
    <div id="msg-modal" class="overlay-modal hidden">
      <div class="modal-card">
        <h3 id="msg-modal-title">Editar Mensagem</h3>
        <textarea id="msg-modal-textarea" rows="4"></textarea>
        <div class="modal-actions">
          <button id="btn-close-msg-modal" class="btn-secondary">Cancelar</button>
          <button id="btn-save-msg-modal" class="btn-primary">Salvar</button>
        </div>
      </div>
    </div>

<!-- ==================== BOTTOM NAVIGATION ==================== -->
    <nav id="bottom-nav" class="bottom-nav">
      <button class="nav-item active" data-target="view-agenda">
        <span class="nav-icon">📅</span>
        <span class="nav-label">AGENDA</span>
      </button>
      <button class="nav-item" data-target="view-clientes">
        <span class="nav-icon">🏃</span>
        <span class="nav-label">CLIENTES</span>
      </button>
      <button class="nav-item" data-target="view-fechamento">
        <span class="nav-icon">📋</span>
        <span class="nav-label">FECHAMENTO</span>
      </button>
      <button class="nav-item" data-target="view-ajustes">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label">AJUSTES</span>
      </button>
    </nav>

  </div>

  <!-- Offscreen Canvas for generating the WhatsApp Receipt PNG -->
  <canvas id="receipt-canvas" width="720" height="1080" style="display:none;"></canvas>

  <script src="js/app.js"></script>
</body>
</html>
